[build]
  base = "."
  command = "pnpm install --ignore-scripts --frozen-lockfile && pnpm run build:netlify"
  publish = "artifacts/nativos-academy/dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.30.3"

[functions]
  directory = "netlify/dist-functions"

[[redirects]]
  from = "/api/healthz"
  to = "/.netlify/functions/healthz"
  status = 200

[[redirects]]
  from = "/api/dashboard"
  to = "/.netlify/functions/dashboard"
  status = 200

[[redirects]]
  from = "/api/activity-feed"
  to = "/.netlify/functions/activity-feed"
  status = 200

[[redirects]]
  from = "/api/courses"
  to = "/.netlify/functions/courses"
  status = 200

[[redirects]]
  from = "/api/courses/:courseId"
  to = "/.netlify/functions/courses-courseId?courseId=:courseId"
  status = 200

[[redirects]]
  from = "/api/courses/:courseId/lessons/:lessonId"
  to = "/.netlify/functions/courses-courseId-lessons-lessonId?courseId=:courseId&lessonId=:lessonId"
  status = 200

[[redirects]]
  from = "/api/progress/:lessonId"
  to = "/.netlify/functions/progress-lessonId?lessonId=:lessonId"
  status = 200

[[redirects]]
  from = "/api/activities"
  to = "/.netlify/functions/activities"
  status = 200

[[redirects]]
  from = "/api/clerk/webhook"
  to = "/.netlify/functions/clerk-webhook"
  status = 200

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin-api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
